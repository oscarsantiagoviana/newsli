; sli.default.ini — the shipped default tuning (embedded in the installer
; and written as sli.ini on a fresh install). Defaults are the honest
; operating point: offload ON, NR ON, every strength at the vendor's own
; default (-1), residual ON (the correctness knob), gate unbounded.
; The installer never overwrites an existing user-tuned sli.ini.
[sli]
offloadOn=1
gpuIndex=-1
nrOn=1
nrStyle=0
nrIntensity=-1.000
nrLocalStructure=-1.000
nrLocalTone=-1.000
nrSkinStructure=-1.000
nrWorkScale=0.250
nrBoost=1.000
forceReset=0
nrTint=0
nrTestSplit=0.000
nrDetail=1.000
nrColour=0.250
nrAutoSkin=1
nrGainBound=2.000
nrFlowReset=6.000
nrGateWaitMs=0.000
nrPerfQuality=2.000
nrRatioPin=0.000
nrDepthMode=0
nrResidual=1
backend=0
fgMode=0
